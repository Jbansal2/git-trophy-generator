name: Bug Report
description: Report a bug or issue
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: What went wrong?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: API URL (if applicable)
      description: The trophy API URL you're using
      placeholder: http://localhost:3000/trophy?username=example

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where is this running?
      options:
        - Local Development
        - Docker
        - Production Server
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Any relevant logs or error messages
      render: shell

  - type: input
    id: deno-version
    attributes:
      label: Deno Version
      description: Run `deno --version`
      placeholder: deno 2.9.4

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information about the problem
