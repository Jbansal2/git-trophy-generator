version: "3.8"

services:
  # GitHub Trophy App
  github-trophy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-trophy-generator
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "node -e \"const http = require('http'); http.get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - github-trophy-network

networks:
  github-trophy-network:
    driver: bridge
