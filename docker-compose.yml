version: "3.8"

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: github-trophy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - github-trophy-network

  # GitHub Trophy App
  github-trophy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-trophy-generator
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CACHE_ENABLED=true
      - CACHE_TTL=3600
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "try { await fetch('http://localhost:3000/health'); Deno.exit(0); } catch { Deno.exit(1); }",
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - github-trophy-network

volumes:
  redis-data:

networks:
  github-trophy-network:
    driver: bridge
